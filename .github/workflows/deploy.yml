# Siteyi yayınlar ve yeni içerikleri LinkedIn'de paylaşır.
#  - main dalına her push'ta çalışır
#  - Her sabah 09:05'te (TR saati) çalışır → ileri tarihli içerikler o gün yayına girer
#  - Actions sekmesinden elle de çalıştırılabilir
name: Yayınla + LinkedIn

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 6 * * *" # 06:05 UTC = 09:05 İstanbul
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: echo "yahyasogut.com" > out/CNAME && touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4

  linkedin:
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ vars.LINKEDIN_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Sitenin yayına girmesini bekle
        run: sleep 30
      - name: LinkedIn'de paylaş
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          SITE_URL: https://yahyasogut.com
        run: npm run linkedin:publish
      - name: Paylaşım kayıtlarını kaydet
        if: always()
        run: |
          git config user.name "linkedin-bot"
          git config user.email "bot@yahyasogut.com"
          git add data/linkedin-published.json
          git diff --cached --quiet || (git commit -m "LinkedIn paylaşım kayıtları güncellendi" && git push)
